[chatgpt]
# TODO: OpenAI ChatGPT API 키를 입력하세요. 예: "sk-..."
api_key = "<YOUR_OPENAI_API_KEY>"

# TODO: 필요하다면 ChatGPT 모델 ID를 변경하세요.
model = "gpt-4.1-mini"

[[mcp_servers]]
# TODO: MCP 서버 식별자 (필요 시 변경)
name = "local-files"
# TODO: 연결 방식(stdio, sse, grpc 등)
transport = "stdio"
# TODO: 서버 실행 명령어와 인자
command = "python"
args = ["-m", "chatgpt_adk_agent.mcp.local_file_server", "--root", "<PATH_TO_SEARCH>"]

[a2a]
# TODO: 다른 에이전트와 소통할 A2A 엔드포인트 기본 URL을 환경에 맞게 수정하세요.
base_url = "http://localhost:8080"
timeout_seconds = 30
