 [build-system]
 requires = ["setuptools>=69.0", "wheel"]
 build-backend = "setuptools.build_meta"

 [project]
 name = "chatgpt-adk-agent"
 version = "0.1.0"
 description = "ChatGPT-forward agent built on top of Google's Agent Development Kit (ADK) with MCP integration."
 readme = "README.md"
 authors = [
   { name = "ADK Test Maintainers" }
 ]
 license = { file = "LICENSE" }
 requires-python = ">=3.10"
 dependencies = [
   "google-gemini-agents>=0.2.0",
   "openai>=1.40.0",
   "modelcontextprotocol>=0.1.3",
   "python-dotenv>=1.0.1",
   "pydantic>=2.7.0",
   "rich>=13.7.0",
   "httpx>=0.27.0"
 ]

 [project.optional-dependencies]
 dev = [
   "pytest>=8.2.0",
   "ruff>=0.6.0"
 ]

 [project.scripts]
 chatgpt-adk-agent = "chatgpt_adk_agent.main:cli"

 [tool.setuptools.packages.find]
 where = ["src"]
 include = ["chatgpt_adk_agent*"]
